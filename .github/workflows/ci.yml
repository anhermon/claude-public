name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PREMIUM_WEB_DIR: plugins/premium-web/skills/premium-web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Critic parser self-check
        run: python -I ${{ env.PREMIUM_WEB_DIR }}/scripts/test_critic_parse.py
      - name: Imagegen unit tests
        working-directory: ${{ env.PREMIUM_WEB_DIR }}/mcp/imagegen
        run: python -m unittest test_core -v
